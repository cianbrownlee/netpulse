name: CI

on:
  push:
  pull_request:

jobs:
  build-and-test:
    name: ${{ matrix.name }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: release
            build_type: RelWithDebInfo
            sanitizer: ""
          # Memory errors and undefined behavior: matters most for the packet parser, which
          # reads untrusted bytes (including the randomized-garbage test).
          - name: asan-ubsan
            build_type: Debug
            sanitizer: address,undefined
          # Data races: the capture -> queue -> aggregator -> snapshot pipeline and the
          # resolver's worker threads.
          - name: tsan
            build_type: Debug
            sanitizer: thread

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build libpcap-dev

      # Ubuntu 24.04 kernels randomize mmap addresses more aggressively than TSan's fixed
      # memory layout tolerates ("FATAL: ThreadSanitizer: unexpected memory mapping").
      - name: Allow ThreadSanitizer on this kernel
        if: matrix.sanitizer == 'thread'
        run: sudo sysctl vm.mmap_rnd_bits=28

      - name: Configure
        run: >
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
          -DNETPULSE_SANITIZER=${{ matrix.sanitizer }}
          -DNETPULSE_WARNINGS_AS_ERRORS=ON

      - name: Build
        run: cmake --build build

      - name: Test
        env:
          ASAN_OPTIONS: detect_leaks=1:abort_on_error=1
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
          TSAN_OPTIONS: halt_on_error=1:second_deadlock_stack=1
        run: ctest --test-dir build --output-on-failure

  windows:
    name: windows (MSVC)
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      # The Npcap SDK (headers and import library) is a free download. The Npcap driver itself
      # can't be installed unattended without a commercial license, so the two replays, which
      # open capture files through it, are skipped here; everything else runs, --demo included.
      - name: Npcap SDK
        shell: pwsh
        run: |
          Invoke-WebRequest https://npcap.com/dist/npcap-sdk-1.16.zip -OutFile npcap-sdk.zip
          Expand-Archive npcap-sdk.zip -DestinationPath npcap-sdk

      - name: Configure
        run: cmake -S . -B build -A x64 -DNPCAP_SDK="${{ github.workspace }}/npcap-sdk" -DNETPULSE_WARNINGS_AS_ERRORS=ON

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure -E "^replay_"

  # Coverage-guided fuzzing of the code that reads untrusted bytes: the packet parser (with the
  # aggregator behind it), the DNS-answer parser, and the kernel capture filter checked against
  # the parser. A minute each per push; the regular test jobs also run every target over the
  # sample captures and random mutations.
  fuzz:
    name: fuzz (libFuzzer)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build libpcap-dev clang libclang-rt-18-dev

      - name: Fuzz
        run: tools/fuzz.sh 60 build-fuzz

      - name: Keep failing inputs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-crashes
          path: build-fuzz/crashes/
